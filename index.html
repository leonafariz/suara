  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&amp;family=Rajdhani:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
    
    .nebula-bg {
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(88, 28, 135, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(6, 182, 212, 0.1) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, rgba(15, 23, 42, 1) 0%, rgba(2, 6, 23, 1) 100%);
    }
    
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle 3s infinite ease-in-out;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    
    .voice-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid;
      animation: pulse-ring 2s infinite ease-out;
    }
    
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    
    .core-glow {
      background: radial-gradient(circle, 
        rgba(6, 182, 212, 0.3) 0%, 
        rgba(139, 92, 246, 0.2) 40%, 
        transparent 70%);
      animation: core-pulse 3s infinite ease-in-out;
    }
    
    @keyframes core-pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    
    .wave-bar {
      animation: wave-dance 0.5s infinite ease-in-out;
    }
    
    .orbital-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: orbit 8s infinite linear;
    }
    
    @keyframes orbit {
      from { transform: rotate(0deg) translateX(140px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(140px) rotate(-360deg); }
    }
    
    .dust-particle {
      position: absolute;
      border-radius: 50%;
      animation: float-dust 15s infinite ease-in-out;
    }
    
    @keyframes float-dust {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
      25% { transform: translateY(-20px) translateX(10px); opacity: 0.6; }
      50% { transform: translateY(-10px) translateX(-15px); opacity: 0.4; }
      75% { transform: translateY(-30px) translateX(5px); opacity: 0.5; }
    }
    
    .button-glow {
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3), 0 0 40px rgba(139, 92, 246, 0.2);
      transition: all 0.3s ease;
    }
    
    .button-glow:hover {
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.5), 0 0 60px rgba(139, 92, 246, 0.4), 0 0 80px rgba(6, 182, 212, 0.3);
      transform: scale(1.05);
    }
    
    .text-glow {
      text-shadow: 0 0 30px rgba(6, 182, 212, 0.5), 0 0 60px rgba(139, 92, 246, 0.3);
    }
    
    .listening-active .wave-bar {
      animation-duration: 0.3s;
    }
    
    .listening-active .core-glow {
      animation-duration: 1.5s;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app-wrapper" class="h-full w-full nebula-bg relative overflow-hidden"><!-- Stars Background -->
   <div id="stars-container" class="absolute inset-0 pointer-events-none"></div><!-- Cosmic Dust -->
   <div id="dust-container" class="absolute inset-0 pointer-events-none"></div><!-- Main Content -->
   <div class="relative h-full flex flex-col items-center justify-center px-4"><!-- Voice Visualizer Container -->
    <div id="voice-container" class="relative flex items-center justify-center mb-12 md:mb-16"><!-- Pulse Rings -->
     <div class="voice-ring w-64 h-64 md:w-80 md:h-80" style="border-color: rgba(6, 182, 212, 0.4); animation-delay: 0s;"></div>
     <div class="voice-ring w-64 h-64 md:w-80 md:h-80" style="border-color: rgba(139, 92, 246, 0.3); animation-delay: 0.5s;"></div>
     <div class="voice-ring w-64 h-64 md:w-80 md:h-80" style="border-color: rgba(6, 182, 212, 0.2); animation-delay: 1s;"></div>
     <div class="voice-ring w-64 h-64 md:w-80 md:h-80" style="border-color: rgba(139, 92, 246, 0.15); animation-delay: 1.5s;"></div><!-- Core Glow -->
     <div class="core-glow absolute w-72 h-72 md:w-96 md:h-96 rounded-full"></div><!-- Orbital Particles -->
     <div class="orbital-particle" style="background: rgba(6, 182, 212, 0.8); animation-delay: 0s;"></div>

     <div class="orbital-particle" style="background: rgba(6, 182, 212, 0.6); animation-delay: -5.3s;"></div><!-- Main Circle with Wave Visualizer --> <button id="voice-circle" class="relative w-48 h-48 md:w-64 md:h-64 rounded-full border border-cyan-500/30 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center cursor-pointer transition-all duration-300 hover:border-cyan-400/50 hover:scale-105"> <!-- Inner Gradient Border -->
      <div class="absolute inset-2 rounded-full border border-purple-500/20 pointer-events-none"></div>

    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-2">
     <div class="w-16 md:w-24 h-px bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent"></div>
     <div class="w-2 h-2 rounded-full bg-cyan-500/50"></div>

   <div class="absolute top-6 left-6 w-12 h-12 border-l border-t border-cyan-500/30"></div>

   <div class="absolute bottom-6 left-6 w-12 h-12 border-l border-b border-purple-500/30"></div>

  <script>
    const defaultConfig = {
      primary_color: '#06b6d4',
      secondary_color: '#8b5cf6',
      background_color: '#020617',
      text_color: '#ffffff',
      accent_color: '#67e8f9'
    };

    // Audio context and analyzer
    let audioContext;
    let analyser;
    let microphone;
    let dataArray;
    let isListening = false;
    let animationId;

    // Generate stars
    function generateStars() {
      const container = document.getElementById('stars-container');
      container.innerHTML = '';
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.width = Math.random() * 2 + 1 + 'px';
        star.style.height = star.style.width;
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (Math.random() * 2 + 2) + 's';
        container.appendChild(star);
      }
    }

    // Generate cosmic dust
    function generateDust() {
      const container = document.getElementById('dust-container');
      container.innerHTML = '';
      for (let i = 0; i < 30; i++) {
        const dust = document.createElement('div');
        dust.className = 'dust-particle';
        dust.style.left = Math.random() * 100 + '%';
        dust.style.top = Math.random() * 100 + '%';
        dust.style.width = Math.random() * 3 + 1 + 'px';
        dust.style.height = dust.style.width;
        dust.style.background = Math.random() > 0.5 ? 'rgba(6, 182, 212, 0.3)' : 'rgba(139, 92, 246, 0.3)';
        dust.style.animationDelay = Math.random() * 10 + 's';
        dust.style.animationDuration = (Math.random() * 10 + 10) + 's';
        container.appendChild(dust);
      }
    }

    // Start microphone
    async function startMicrophone() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        
        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        
        microphone.connect(analyser);
        
        return true;
      } catch (error) {
        console.error('Microphone access denied:', error);
        return false;
      }
    }

    // Stop microphone
    function stopMicrophone() {
      if (microphone && microphone.mediaStream) {
        microphone.mediaStream.getTracks().forEach(track => track.stop());
      }
      if (audioContext) {
        audioContext.close();
      }
      if (animationId) {
        cancelAnimationFrame(animationId);
      }
    }

    // Animate wave bars based on audio
    function animateWaveBars() {
      if (!isListening) return;
      
      analyser.getByteFrequencyData(dataArray);
      
      // Calculate average volume to detect sound
      const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
      const hasSound = average > 5; // Threshold for detecting sound
      
      const waveBars = document.querySelectorAll('.wave-bar');
      
      if (!hasSound) {
        // No sound detected - keep bars at minimum height
        waveBars.forEach(bar => {
          bar.style.height = '20px';
          bar.style.opacity = '0.6';
        });
      } else {
        // Sound detected - animate bars based on frequency
        waveBars.forEach((bar, index) => {
          const dataIndex = Math.floor((index / waveBars.length) * dataArray.length);
          const value = dataArray[dataIndex] / 255;
          
          // Calculate height based on frequency data
          const minHeight = 20;
          const maxHeight = 100;
          const height = minHeight + (value * (maxHeight - minHeight));
          
          bar.style.height = height + 'px';
          bar.style.opacity = '1';
        });
      }
      
      animationId = requestAnimationFrame(animateWaveBars);
    }

    // Button interaction
    document.getElementById('voice-circle').addEventListener('click', async function() {
      const voiceContainer = document.getElementById('voice-container');
      const button = this;
      
      isListening = !isListening;
      
      if (isListening) {
        const micStarted = await startMicrophone();
        
        if (!micStarted) {
          isListening = false;
          return;
        }
        
        voiceContainer.classList.add('listening-active');
        button.classList.add('border-cyan-400/60', 'scale-105');
        
        animateWaveBars();
      } else {
        stopMicrophone();
        
        voiceContainer.classList.remove('listening-active');
        button.classList.remove('border-cyan-400/60', 'scale-105');
        
        // Reset wave bars
        document.querySelectorAll('.wave-bar').forEach(bar => {
          bar.style.height = '20px';
          bar.style.opacity = '1';
        });
      }
    });

    // Initialize
    generateStars();
    generateDust();
  </script>
